spring.application.name=reviewr

# Database. Local defaults below; on Render set
# SPRING_DATASOURCE_URL, SPRING_DATASOURCE_USERNAME and SPRING_DATASOURCE_PASSWORD.
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/reviewr_db}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:postgre}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# JWT. Set JWT_SECRET (at least 32 characters) in production.
# The fallback is only for running the app on your own machine.
jwt.secret=${JWT_SECRET:local-dev-secret-change-me-at-least-32-characters}
jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}
