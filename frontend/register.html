<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Reviewr — Create Account</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body class="auth-page">

    <div class="auth-card">
      <div class="auth-card__logo">Reviewr</div>
      <p class="auth-card__subtitle">Create a new account</p>

      <form id="register-form" class="auth-card__form">
        <input class="form-control" type="text"     id="reg-username" placeholder="Username"              required maxlength="50" autocomplete="username" />
        <input class="form-control" type="email"    id="reg-email"    placeholder="Email address"         required autocomplete="email" />
        <div class="pw-field">
          <input class="form-control" type="password" id="reg-password" placeholder="Password (min 6 chars)" required minlength="6" maxlength="100" autocomplete="new-password" />
          <button type="button" class="pw-toggle" aria-label="Toggle password visibility"></button>
        </div>
        <p id="reg-message" class="auth-card__error"></p>
        <button type="submit" class="btn btn--primary btn--full">Create Account</button>
      </form>

      <p class="auth-card__footer">
        Already have an account? <a href="login.html">Sign in</a>
      </p>
    </div>

    <script type="module" src="js/register.js"></script>
  </body>
</html>
